name: notify
on:
  pull_request:
    types: [opened, closed]
  issues:
    types: [opened]

jobs:
  slack:
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ github.event_name }}: ${{ github.event.pull_request.title || github.event.issue.title }}\n${{ github.event.pull_request.html_url || github.event.issue.html_url }}"
