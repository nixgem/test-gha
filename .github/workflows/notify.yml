name: notify
on:
  push:

jobs:
  slack:
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Branch: ${{ github.ref_name }}\nRepo: ${{ github.repository }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.event.head_commit.author.name }}\nDate: ${{ github.event.head_commit.timestamp }}\nChanged paths: ${{ join(github.event.head_commit.added, ', ') }} ${{ join(github.event.head_commit.modified, ', ') }} ${{ join(github.event.head_commit.removed, ', ') }}\nLog Message:\n${{ github.event.head_commit.message }}\nCompare: ${{ github.event.compare }}"
